<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>James Ponwith · Constellation</title>
<meta name="description" content="James Ponwith — Principal Software Engineer. Projects mapped as a constellation.">
<meta name="theme-color" content="#03050b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root {
  --bg: #03050b; --ink: #e9eef8; --mute: #8d97ab; --faint: #5b6478;
  --line: rgba(150,180,255,.12); --glass: rgba(9,14,27,.68); --glass-b: rgba(160,190,255,.14);
  --accent: #6cb6ff; --fin: #8ee6dc; --sport: #ffb547;
  --ff-d: 'Space Grotesk', system-ui, sans-serif; --ff: 'Inter', system-ui, sans-serif; --ff-m: 'JetBrains Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 15px/1.6 var(--ff);
  background: radial-gradient(120% 90% at 50% 42%, #0b1430 0%, #050814 48%, #020309 100%) fixed var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--ff-m); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 16px; top: -60px; z-index: 50; padding: 8px 14px; border-radius: 10px; border: 0; background: var(--accent); color: #02101f; font-weight: 600; cursor: pointer; }
.skip:focus { top: 16px; }

/* stage */
#stage { position: fixed; inset: 0; outline: none; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#stage:focus-visible::after { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(108,182,255,.35); border-radius: 18px; pointer-events: none; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; transition: opacity .8s; }
.glabel { position: absolute; left: 0; top: 0; font: 500 10.5px/1 var(--ff-m); letter-spacing: .38em; text-transform: uppercase; color: var(--c); opacity: .55; white-space: nowrap; will-change: transform; }
body.panel-open .glabel { opacity: .18; }
#hover {
  position: absolute; left: 0; top: 0; padding: 8px 12px; border-radius: 10px; white-space: nowrap;
  background: rgba(8,12,24,.72); border: 1px solid var(--glass-b); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  opacity: 0; transition: opacity .25s; will-change: transform;
}
#hover.on { opacity: 1; }
#hover b { display: block; font: 500 14.5px/1.25 var(--ff-d); }
#hover span { font: 11px/1.4 var(--ff-m); color: var(--mute); }

/* intro */
#intro { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; text-align: center; pointer-events: none; padding: 24px; transition: opacity 1.4s var(--ease), filter 1.4s var(--ease); }
body.intro #intro { display: grid; }
#intro.out { opacity: 0; filter: blur(8px); }
#intro > div > * { animation: rise 1.6s var(--ease) backwards; }
.intro-kicker { font: 500 11.5px/1 var(--ff-m); letter-spacing: .42em; text-transform: uppercase; color: var(--accent); margin: 0 0 22px; animation-delay: .2s !important; }
.intro-name { font: 500 clamp(46px, 9vw, 124px)/.92 var(--ff-d); letter-spacing: -.04em; margin: 0; background: linear-gradient(180deg, #fff 30%, #9fbde8); -webkit-background-clip: text; background-clip: text; color: transparent; animation-delay: .45s !important; }
.intro-sub { color: var(--mute); max-width: 46ch; margin: 26px auto 0; font-size: 15.5px; animation-delay: .9s !important; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }

/* HUD */
.hud { position: fixed; z-index: 10; transition: opacity .9s var(--ease), transform .9s var(--ease); }
body.intro .hud, body.intro .hint, body.intro #labels { opacity: 0; pointer-events: none; }
body.intro .hud { transform: translateY(8px); }
.glassbar { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(9,14,27,.5); border: 1px solid var(--glass-b); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 0; border-radius: 999px; background: none; cursor: pointer; text-decoration: none; font: 500 13px/1.2 var(--ff); color: rgba(233,238,248,.82); white-space: nowrap; transition: background .2s, color .2s; }
.pill:hover { background: rgba(255,255,255,.07); color: #fff; }
.pill[aria-pressed="true"] { background: rgba(108,182,255,.15); color: #d9ecff; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }

.hud-tl { top: 20px; left: 24px; pointer-events: none; }
.hud-tl > * { pointer-events: auto; }
.back { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px/1 var(--ff-m); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); text-decoration: none; padding: 7px 11px; border: 1px solid var(--glass-b); border-radius: 999px; background: rgba(9,14,27,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.back:hover { color: var(--ink); }
.brand { font: 600 22px/1.1 var(--ff-d); letter-spacing: -.015em; margin: 16px 0 5px; }
.role { margin: 0; font: 11.5px/1.4 var(--ff-m); color: var(--mute); }
.hud-tr { top: 20px; right: 24px; }
.hud-bl { bottom: calc(22px + env(safe-area-inset-bottom)); left: 24px; }
.hud-br { bottom: calc(26px + env(safe-area-inset-bottom)); right: 26px; margin: 0; display: flex; gap: 26px; text-align: right; }
.hud-br div { display: flex; flex-direction: column-reverse; }
.hud-br dd { margin: 0; font: 500 15px/1.2 var(--ff-d); color: var(--ink); }
.hud-br dt { font: 10px/1.4 var(--ff-m); color: var(--faint); letter-spacing: .02em; }
.hint { position: fixed; z-index: 9; left: 50%; bottom: 84px; transform: translateX(-50%); margin: 0; font: 11px/1 var(--ff-m); letter-spacing: .08em; color: var(--faint); white-space: nowrap; transition: opacity 1.2s; pointer-events: none; }
.hud-br { transition: opacity .5s; }
body.panel-open .hud-br { opacity: 0; }
.hint.gone, body.panel-open .hint, body.list-open .hint { opacity: 0; }
#toast { position: fixed; z-index: 60; left: 50%; bottom: 110px; transform: translate(-50%, 10px); padding: 10px 16px; border-radius: 999px; background: rgba(12,20,38,.92); border: 1px solid var(--glass-b); font: 12.5px/1 var(--ff-m); opacity: 0; transition: opacity .3s, transform .3s var(--ease); pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* list overlay */
.list { position: fixed; inset: 0; z-index: 20; overflow-y: auto; overscroll-behavior: contain; background: rgba(3,5,11,.74); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.list.open { opacity: 1; visibility: visible; transition: opacity .4s; }
.list-inner { max-width: 1040px; margin: 0 auto; padding: 132px 24px 140px; }
.list-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; }
.list-head h2 { font: 500 30px/1.1 var(--ff-d); letter-spacing: -.02em; margin: 0; flex: 1; }
.list ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 4px; width: 100%; height: 100%; text-align: left; padding: 16px 18px 18px; border-radius: 14px; cursor: pointer; background: rgba(14,20,36,.6); border: 1px solid var(--line); transition: border-color .2s, background .2s, transform .2s var(--ease); }
.card:hover { border-color: rgba(108,182,255,.4); background: rgba(18,28,50,.7); transform: translateY(-2px); }
.card-top { display: flex; align-items: center; gap: 8px; font: 10.5px/1.4 var(--ff-m); color: var(--mute); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.card-top .yr { margin-left: auto; }
.card-title { font: 500 18px/1.25 var(--ff-d); }
.card-sub { font-size: 13px; color: var(--mute); }
.card-blurb { font-size: 13px; line-height: 1.5; color: #b4bdcf; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
.x { border: 1px solid var(--glass-b); background: rgba(255,255,255,.04); border-radius: 999px; padding: 7px 14px; cursor: pointer; font: 500 12px/1 var(--ff-m); color: var(--mute); }
.x:hover { color: var(--ink); }

/* panel */
.panel {
  position: fixed; z-index: 30; top: 12px; right: 12px; bottom: 12px; width: min(450px, calc(100vw - 24px));
  display: flex; flex-direction: column; overflow: hidden; border-radius: 20px;
  background: var(--glass); border: 1px solid var(--glass-b); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
  box-shadow: 0 30px 90px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
  transform: translateX(calc(100% + 24px)); visibility: hidden;
  transition: transform .65s var(--ease), visibility 0s linear .65s;
}
.panel.open { transform: none; visibility: visible; transition: transform .65s var(--ease); }
.panel-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 22px; border-bottom: 1px solid var(--line); }
.count { font-size: 11px; color: var(--mute); letter-spacing: .1em; flex: 1; text-transform: uppercase; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid transparent; background: none; cursor: pointer; color: var(--mute); transition: background .2s, color .2s; }
.ib:hover { background: rgba(255,255,255,.07); color: var(--ink); }
.ib svg { width: 16px; height: 16px; }
.panel[data-mode="about"] .navbtn { display: none; }
.panel-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 24px 26px 32px; }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; font: 10.5px/1.4 var(--ff-m); color: var(--mute); text-transform: uppercase; letter-spacing: .12em; }
.eyebrow b { color: var(--sport); font-weight: 500; }
.panel h2 { font: 500 31px/1.08 var(--ff-d); letter-spacing: -.025em; margin: 0; }
.sub { margin: 6px 0 20px; color: var(--mute); }
.panel h3 { font: 500 10.5px/1 var(--ff-m); text-transform: uppercase; letter-spacing: .16em; color: var(--faint); margin: 26px 0 12px; }
.panel p { margin: 0 0 14px; color: #c9d1e0; }
.panel .lede { color: var(--ink); font-size: 16.5px; line-height: 1.55; }
.media { margin: 0 0 20px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #02040a; aspect-ratio: 16 / 10; }
.media img, .media video { display: block; width: 100%; height: 100%; object-fit: cover; }
.media.portrait { aspect-ratio: 4 / 3; }
.term { margin: 0 0 20px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: rgba(2,4,10,.85); }
.term-bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.term-bar i { width: 9px; height: 9px; border-radius: 50%; background: #2a3346; }
.term-bar span { margin-left: 8px; font: 10.5px/1 var(--ff-m); color: var(--faint); }
.term pre { margin: 0; padding: 14px 16px 16px; font: 12px/1.75 var(--ff-m); color: #a9b6cc; overflow-x: auto; white-space: pre; }
.term pre span { display: block; animation: line .25s ease backwards; animation-delay: calc(var(--d) * 170ms + 250ms); }
.term pre .cmd { color: var(--accent); }
.term pre .cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: middle; animation: line .25s ease backwards calc(var(--d) * 170ms + 250ms), blink 1.1s steps(1) infinite calc(var(--d) * 170ms + 250ms); }
@keyframes line { from { opacity: 0; transform: translateX(-4px); } }
@keyframes blink { 50% { opacity: 0; } }
.bullets { list-style: none; margin: 0 0 6px; padding: 0; }
.bullets li { position: relative; padding-left: 20px; margin-bottom: 8px; color: #c9d1e0; font-size: 14.5px; }
.bullets li::before { content: ''; position: absolute; left: 0; top: .78em; width: 10px; height: 1px; background: var(--accent); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { font: 11.5px/1 var(--ff-m); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: #c5d0e4; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 10px; text-decoration: none; cursor: pointer; font: 500 13.5px/1 var(--ff); color: #dcecff; background: rgba(108,182,255,.1); border: 1px solid rgba(108,182,255,.3); transition: background .2s, border-color .2s; }
.btn:hover { background: rgba(108,182,255,.2); border-color: rgba(108,182,255,.55); }
.rel { display: flex; flex-direction: column; gap: 6px; }
.chip-btn { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.025); cursor: pointer; font-size: 13.5px; transition: border-color .2s, background .2s; }
.chip-btn:hover { border-color: rgba(108,182,255,.4); background: rgba(108,182,255,.06); }
.chip-btn .mono { margin-left: auto; font-size: 10.5px; color: var(--faint); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.stat-grid div { display: flex; flex-direction: column-reverse; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.025); }
.stat-grid dd { margin: 0; font: 500 22px/1.2 var(--ff-d); }
.stat-grid dt { font: 10.5px/1.4 var(--ff-m); color: var(--mute); }

/* no-WebGL fallback: the list is the page */
body.nogl { overflow-y: auto; height: auto; min-height: 100%; }
body.nogl #stage, body.nogl #labels, body.nogl .hint, body.nogl [data-act="list"], body.nogl .list .x, body.nogl .hud-br { display: none; }
body.nogl .list { position: static; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; overflow: visible; }

@media (max-width: 1100px) { .hud-br { display: none; } }
@media (max-width: 720px) {
  .hud-tl { top: 14px; left: 16px; }
  .brand { font-size: 19px; margin-top: 12px; }
  .hud-tr { top: auto; right: 16px; left: 16px; bottom: calc(66px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  .hud-bl { left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  .pill { padding: 7px 10px; font-size: 12.5px; }
  .hint { display: none; }
  .list-inner { padding: 112px 16px 150px; }
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: min(74vh, 680px); transform: translateY(calc(100% + 16px)); }
  .panel-body { padding: 20px 18px 28px; }
  .panel h2 { font-size: 26px; }
}
@media (max-width: 560px) { .hide-sm { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  #intro { display: none !important; }
}
</style>
</head>
<body class="intro">
<button class="skip" data-act="list">Skip to project list</button>

<header class="hud hud-tl">
  <a class="back" href="../"><span aria-hidden="true">←</span> Variations</a>
  <h1 class="brand" id="brand">James Ponwith</h1>
  <p class="role" id="role"></p>
</header>

<nav class="hud hud-tr" aria-label="Site">
  <div class="glassbar">
    <button class="pill" data-act="about">About</button>
    <button class="pill" data-act="list" aria-pressed="false">List view</button>
    <a class="pill" id="l-resume" target="_blank" rel="noopener">Resume</a>
    <a class="pill hide-sm" id="l-gh" target="_blank" rel="noopener">GitHub</a>
    <a class="pill hide-sm" id="l-li" target="_blank" rel="noopener">LinkedIn</a>
    <button class="pill" data-act="email">Email</button>
  </div>
</nav>

<div id="stage" tabindex="0" role="application" aria-roledescription="star map" aria-label="Project constellation. Press Tab or arrow keys to move between stars, Enter to open one."></div>
<div id="labels" aria-hidden="true"><div id="hover"></div></div>

<div id="intro" aria-hidden="true">
  <div>
    <p class="intro-kicker" id="intro-kicker"></p>
    <p class="intro-name">James Ponwith</p>
    <p class="intro-sub" id="intro-sub"></p>
  </div>
</div>

<div class="hud hud-bl" role="group" aria-label="Filter projects">
  <div class="glassbar">
    <button class="pill" data-filter="all" aria-pressed="true">All</button>
    <button class="pill" data-filter="tech" aria-pressed="false"><i style="--c:var(--accent)"></i>Tech</button>
    <button class="pill" data-filter="finance" aria-pressed="false"><i style="--c:var(--fin)"></i>Finance</button>
    <button class="pill" data-filter="sport" aria-pressed="false"><i style="--c:var(--sport)"></i>Sport</button>
  </div>

  <div class="list-inner">
    <div class="list-head"><h2 id="list-h">Projects</h2><button class="x" data-act="list-close">Close · Esc</button></div>
    <ol id="list-items"></ol>
  </div>
</section>

<aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title">
  <div class="panel-head">
    <span id="panel-count" class="mono count"></span>
    <button class="ib navbtn" data-act="prev" aria-label="Previous project"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="ib navbtn" data-act="next" aria-label="Next project"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    <button class="ib" id="panel-close" data-act="close" aria-label="Close panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="panel-body" class="panel-body"></div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sr" class="sr" aria-live="polite"></div>

<script src="../data.js"></script>
<script type="module">
const S = window.SITE;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
mq.addEventListener?.('change', e => { reduced = e.matches; });
const TAG = { tech: { c: '#6cb6ff', label: 'Tech' }, finance: { c: '#8ee6dc', label: 'Finance' }, sport: { c: '#ffb547', label: 'Sport' } };
const P = S.projects;
const idx = Object.fromEntries(P.map((p, i) => [p.id, i]));
const isExt = h => /^https?:/.test(h);
const extAttrs = h => isExt(h) ? ' target="_blank" rel="noopener"' : '';
const hash = decodeURIComponent(location.hash.slice(1));
if (reduced || hash) document.body.classList.remove('intro');

// Projects that share a stack item are linked.
const edges = [], nbrs = P.map(() => []);
P.forEach((a, i) => P.forEach((b, j) => {
  if (j <= i) return;
  const sb = new Set(b.stack.map(s => s.toLowerCase()));
  const shared = a.stack.filter(s => sb.has(s.toLowerCase()));
  if (!shared.length) return;
  edges.push({ a: i, b: j });
  nbrs[i].push({ j, shared }); nbrs[j].push({ j: i, shared });
}));

let filter = 'all', gl = null, current = null, opener = null;
const matches = p => filter === 'all' || p.tags.includes(filter);
const order = () => P.map((_, i) => i).filter(i => matches(P[i]));
const dots = tags => `<span class="dots" aria-hidden="true">${tags.map(t => `<i style="--c:${TAG[t].c}"></i>`).join('')}</span>`;
const announce = m => { $('#sr').textContent = m; };

// ---------- static content ----------
$('#role').textContent = `${S.title} · ${S.location}`;
$('#intro-kicker').textContent = `${S.title} · ${S.location}`;
$('#intro-sub').textContent = S.tagline;
$('#l-resume').href = S.resume; $('#l-gh').href = S.github; $('#l-li').href = S.linkedin;
const statsHTML = S.stats.map(s => `<div><dt>${esc(s.label)}</dt><dd>${esc(s.value)}</dd></div>`).join('');
$('#stats').innerHTML = statsHTML;
$('#list-items').innerHTML = P.map(p => `<li data-id="${esc(p.id)}"><button class="card" data-open="${esc(p.id)}">
  <span class="card-top">${dots(p.tags)}<span>${esc(p.kind)}</span><span class="yr">${p.year}</span></span>
  <span class="card-title">${esc(p.title)}</span><span class="card-sub">${esc(p.subtitle)}</span>
  <span class="card-blurb">${esc(p.blurb)}</span></button></li>`).join('');

let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
async function copyEmail() {
  try { await navigator.clipboard.writeText(S.email); toast(`Copied ${S.email}`); }
  catch { location.href = `mailto:${S.email}`; }
}

function setFilter(f) {
  filter = f;
  $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === f)));
  $$('#list-items li').forEach(li => { li.hidden = !matches(P[idx[li.dataset.id]]); });
  gl?.refresh();
  announce(`${f === 'all' ? 'All' : TAG[f].label} projects: ${order().length}`);
}

function setList(on) {
  if (document.body.classList.contains('nogl')) { $('#list-items button')?.focus(); return; }
  $('#list').classList.toggle('open', on);
  document.body.classList.toggle('list-open', on);
  $('.hud-tr [data-act="list"]').setAttribute('aria-pressed', String(on));
  (on ? $('#list-items li:not([hidden]) button') : $('.hud-tr [data-act="list"]'))?.focus();
}

// ---------- panel ----------
const panel = $('#panel'), pb = $('#panel-body');
const isOpen = () => panel.classList.contains('open');
function stopMedia() { $$('video', pb).forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); }); }

function media(p) {
  const m = p.media;
  if (m?.type === 'video') return `<figure class="media"><video muted loop playsinline controls preload="none" poster="${esc(m.poster)}" src="${esc(m.src)}" aria-label="${esc(p.title)} demo video"></video></figure>`;
  if (m?.type === 'img') return `<figure class="media"><img src="${esc(m.src)}" alt="${esc(p.title)} demo" loading="lazy" decoding="async"></figure>`;
  if (p.term) return `<figure class="term" aria-label="${esc(p.title)} terminal excerpt"><div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>${esc(p.id)} — zsh</span></div><pre>${
    p.term.map((l, k) => `<span class="${k === 0 ? 'cmd' : ''}" style="--d:${k}">${esc(l)}</span>`).join('')
  }<span class="cursor" style="--d:${p.term.length}" aria-hidden="true"></span></pre></figure>`;
  return '';
}

function showPanel() {
  if (!isOpen()) opener = document.activeElement;
  panel.classList.add('open');
  document.body.classList.add('panel-open');
  pb.scrollTop = 0;
  $('#panel-close').focus({ preventScroll: true });
  gl?.panel(true);
}

function openProject(i) {
  const p = P[i], o = order(), k = o.indexOf(i);
  showPanel();
  stopMedia(); current = i; panel.dataset.mode = 'project';
  $('#panel-count').textContent = k >= 0 ? `${String(k + 1).padStart(2, '0')} / ${String(o.length).padStart(2, '0')}` : p.kind;
  pb.innerHTML = `
    <p class="eyebrow">${dots(p.tags)}<span>${esc(p.kind)} · ${p.year}</span>${p.featured ? '<b>Featured</b>' : ''}</p>
    <h2 id="panel-title">${esc(p.title)}</h2>
    <p class="sub">${esc(p.subtitle)}</p>
    ${media(p)}
    <p>${esc(p.blurb)}</p>
    ${p.bullets ? `<ul class="bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
    <h3>Stack</h3><ul class="chips">${p.stack.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    ${p.links.length ? `<div class="links">${p.links.map(l => `<a class="btn" href="${esc(l.href)}"${extAttrs(l.href)}>${esc(l.label)} <span aria-hidden="true">${isExt(l.href) ? '↗' : '→'}</span></a>`).join('')}</div>` : ''}
    ${nbrs[i].length ? `<h3>Shares stack with</h3><div class="rel">${nbrs[i].map(n => `<button class="chip-btn" data-open="${esc(P[n.j].id)}">${dots(P[n.j].tags)}<span>${esc(P[n.j].title)}</span><span class="mono">${esc(n.shared.join(', '))}</span></button>`).join('')}</div>` : ''}`;
  const v = $('video', pb);
  if (v && !reduced) v.play().catch(() => {});
  gl?.select(i);
  history.replaceState(null, '', '#' + p.id);
}

function openAbout() {
  showPanel();
  stopMedia(); current = 'about'; panel.dataset.mode = 'about';
  $('#panel-count').textContent = 'About';
  pb.innerHTML = `
    <p class="eyebrow"><span>${esc(S.location)}</span></p>
    <h2 id="panel-title">${esc(S.name)}</h2>
    <p class="sub">${esc(S.title)}</p>
    <figure class="media portrait"><img src="${esc(S.portrait)}" alt="Personal photo" loading="lazy" decoding="async"></figure>
    <p class="lede">${esc(S.tagline)}</p>
    ${S.about.map(a => `<p>${esc(a)}</p>`).join('')}
    <h3>By the numbers</h3><dl class="stat-grid">${statsHTML}</dl>
    <h3>Stack</h3><ul class="chips">${S.stack.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    <div class="links">
      <a class="btn" href="${esc(S.resume)}" target="_blank" rel="noopener">Resume <span aria-hidden="true">↗</span></a>
      <a class="btn" href="${esc(S.github)}" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
      <a class="btn" href="${esc(S.linkedin)}" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a>
      <button class="btn" data-act="email">Copy email</button>
    </div>`;
  gl?.select(-1);
  history.replaceState(null, '', '#about');
}

function closePanel() {
  if (!isOpen()) return;
  panel.classList.remove('open');
  document.body.classList.remove('panel-open');
  stopMedia(); current = null;
  gl?.select(-1); gl?.panel(false);
  history.replaceState(null, '', location.pathname + location.search);
  const back = opener && document.contains(opener) && !opener.closest('#list:not(.open), #panel') ? opener : $('#stage');
  back.focus({ preventScroll: true }); opener = null;
}

function step(d) {
  if (typeof current !== 'number') return;
  const o = order(); if (!o.length) return;
  const k = o.indexOf(current);
  openProject(o[k < 0 ? 0 : (k + d + o.length) % o.length]);
}

document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { if (o.closest('#list')) setList(false); openProject(idx[o.dataset.open]); return; }
  const f = e.target.closest('[data-filter]');
  if (f) { setFilter(f.dataset.filter); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  ({
    about: openAbout, email: copyEmail, close: closePanel, prev: () => step(-1), next: () => step(1),
    list: () => setList(!$('#list').classList.contains('open')), 'list-close': () => setList(false),
  })[a.dataset.act]?.();
});

addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (isOpen()) closePanel();
    else if ($('#list').classList.contains('open')) setList(false);
    return;
  }
  if (isOpen() && panel.contains(document.activeElement) && !e.target.closest('video')) {
    if (e.key === 'ArrowRight' || e.key === ']') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft' || e.key === '[') { e.preventDefault(); step(-1); }
  }
});

// ---------- WebGL constellation ----------
async function initGL(skipIntro) {
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('WebGL unavailable');
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { Vector3: V3, Color } = THREE;
  THREE.ColorManagement.enabled = false; // colors render exactly as written

  const stage = $('#stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);
  const cv = renderer.domElement;
  cv.setAttribute('aria-hidden', 'true');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 4000);
  const world = new THREE.Group();
  scene.add(world);

  let seed = 20260425; // deterministic layout
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
  const white = new Color(1, 1, 1);

  const tex = draw => { const c = document.createElement('canvas'); c.width = c.height = 128; draw(c.getContext('2d'), 128); return new THREE.CanvasTexture(c); };
  const radial = stops => tex((g, s) => {
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    stops.forEach(([o, a]) => gr.addColorStop(o, `rgba(255,255,255,${a})`));
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
  const T = {
    halo: radial([[0, 1], [0.08, .7], [0.22, .22], [0.5, .05], [1, 0]]),
    core: radial([[0, 1], [0.2, .95], [0.45, .25], [1, 0]]),
    neb: radial([[0, .9], [0.3, .35], [0.65, .08], [1, 0]]),
    spike: tex((g, s) => {
      for (const v of [0, 1]) {
        const gr = v ? g.createLinearGradient(0, 0, 0, s) : g.createLinearGradient(0, 0, s, 0);
        gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; v ? g.fillRect(s / 2 - .75, 0, 1.5, s) : g.fillRect(0, s / 2 - .75, s, 1.5);
      }
    }),
    ring: tex((g, s) => {
      g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 4, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = .5; g.setLineDash([2, 6]); g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 14, 0, Math.PI * 2); g.stroke();
    }),
  };
  const sprite = (map, color, opacity = 1) => new THREE.Sprite(new THREE.SpriteMaterial({ map, color, opacity, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));

  // Point clouds: one tiny shader, size attenuation + twinkle.
  const mats = [];
  const pointsMat = (scale, twinkle) => {
    const m = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uScale: { value: scale }, uTw: { value: 0 } },
      vertexShader: `attribute float aSize; attribute float aPhase; attribute vec3 aColor;
        uniform float uTime, uPR, uScale, uTw; varying vec3 vC; varying float vA;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = clamp(aSize * uScale / -mv.z, 1.0, 14.0) * uPR;
          vC = aColor;
          vA = 1.0 - uTw * 0.55 * (0.5 + 0.5 * sin(uTime * (0.4 + fract(aPhase * 7.13) * 1.8) + aPhase * 6.283));
        }`,
      fragmentShader: `varying vec3 vC; varying float vA;
        void main() { float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); gl_FragColor = vec4(vC * vA, a * a); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    m.userData.twinkle = twinkle; mats.push(m); return m;
  };
  const cloud = (n, fn, scale, twinkle = true) => {
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n), ph = new Float32Array(n);
    const c = new Color(), v = new V3();
    for (let k = 0; k < n; k++) { size[k] = fn(k, v, c); v.toArray(pos, k * 3); c.toArray(col, k * 3); ph[k] = rnd(); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
    return new THREE.Points(g, pointsMat(scale, twinkle));
  };

  // Background starfield (outside `world`, so mouse parallax separates the layers).
  const bgCols = ['#ffffff', '#d6e4ff', '#a8c8ff', '#ffe3bd'].map(c => new Color(c));
  const stars = cloud(4200, (k, v, c) => {
    v.randomDirection().multiplyScalar(380 + rnd() * 900);
    const r = rnd(); c.copy(bgCols[r < .5 ? 0 : r < .75 ? 1 : r < .92 ? 2 : 3]).multiplyScalar(.3 + rnd() * .7);
    return 1.3 + rnd() ** 4 * 4.5;
  }, 700);
  scene.add(stars);

  // Galaxies
  const G = { tech: new V3(-30, 3, -6), finance: new V3(30, 12, -10), sport: new V3(20, -16, 16) };
  const tilts = {}, spinners = [];
  for (const [t, cen] of Object.entries(G)) {
    const col = new Color(TAG[t].c);
    tilts[t] = new THREE.Euler(gauss() * .45, rnd() * 6.28, gauss() * .35);
    for (let k = 0; k < 3; k++) {
      const s = sprite(T.neb, col, .065);
      s.position.copy(cen).add(new V3(gauss() * 6, gauss() * 3, gauss() * 6));
      s.scale.setScalar(36 + rnd() * 28);
      world.add(s);
    }
    const gal = new THREE.Group(); gal.position.copy(cen); gal.rotation.copy(tilts[t]);
    const dust = cloud(900, (k, v, c) => {
      const u = rnd(), a = u * 5 + (k % 2) * Math.PI + gauss() * .35, r = 1.5 + u * 22;
      v.set(Math.cos(a) * r, gauss() * 1.2 * (1 - u * .6), Math.sin(a) * r);
      c.copy(col).lerp(white, rnd() * .5).multiplyScalar(.2 + rnd() * .45);
      return .4 + rnd() * .8;
    }, 260);
    dust.userData.spin = .012 + rnd() * .01;
    gal.add(dust); world.add(gal); spinners.push(dust);
  }

  // Node layout: weighted toward non-tech tags so multi-tag projects sit between galaxies.
  const W = { tech: .25, finance: 1, sport: 1 };
  const weight = (p, t) => p.tags.length > 1 ? W[t] : 1;
  const groups = {};
  P.forEach((p, i) => (groups[[...p.tags].sort().join()] ??= []).push(i));
  const pos = [];
  for (const ids of Object.values(groups)) {
    const n = ids.length, R = 3 + 3.2 * Math.sqrt(n), rot = rnd() * 6.28;
    ids.forEach((i, k) => {
      const p = P[i], c = new V3(); let w = 0;
      p.tags.forEach(t => { c.addScaledVector(G[t], weight(p, t)); w += weight(p, t); });
      const r = R * Math.sqrt((k + .5) / n), a = rot + k * 2.39996;
      const off = new V3(Math.cos(a) * r, gauss() * 2.5, Math.sin(a) * r).applyEuler(tilts[p.tags.find(t => t !== 'tech') ?? 'tech']);
      pos[i] = c.divideScalar(w).add(off);
    });
  }
  const center = pos.reduce((a, v) => a.add(v), new V3()).divideScalar(pos.length);

  const nodes = P.map((p, i) => {
    const col = new Color(0, 0, 0); let w = 0;
    p.tags.forEach(t => { col.add(new Color(TAG[t].c).multiplyScalar(weight(p, t))); w += weight(p, t); });
    col.multiplyScalar(1 / w);
    const g = new THREE.Group(); g.position.copy(pos[i]);
    const halo = sprite(T.halo, col), spike = sprite(T.spike, col), core = sprite(T.core, col.clone().lerp(white, .65));
    g.add(halo, spike, core); world.add(g);
    return { g, halo, spike, core, col, base: p.featured ? 1.45 : 1, dim: 1, hov: 0, ph: rnd() * 6.28 };
  });
  const ring = sprite(T.ring, new Color('#cfe6ff'), 0);
  world.add(ring);

  // Edges + travelling signals
  const ePos = new Float32Array(edges.length * 6), eCol = new Float32Array(edges.length * 6);
  edges.forEach((e, k) => { pos[e.a].toArray(ePos, k * 6); pos[e.b].toArray(ePos, k * 6 + 3); });
  const eGeo = new THREE.BufferGeometry();
  eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
  eGeo.setAttribute('color', new THREE.BufferAttribute(eCol, 3));
  world.add(new THREE.LineSegments(eGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
  const sig = cloud(edges.length, (k, v, c) => { v.copy(pos[edges[k].a]); c.setRGB(0, 0, 0); return 2.6; }, 260, false);
  world.add(sig);

  // DOM labels
  const labels = Object.keys(G).map(t => {
    const el = document.createElement('div');
    el.className = 'glabel'; el.style.setProperty('--c', TAG[t].c); el.textContent = TAG[t].label;
    $('#labels').append(el);
    return { el, v: G[t].clone().add(new V3(0, 15, 0)) };
  });
  const hoverEl = $('#hover');

  // State
  let selected = -1, hovered = -1, kbd = -1, shownAct = -2, panelOpen = false, introOn = false, par = 1;
  const mouse = { x: 0, y: 0 }, shift = { x: 0, y: 0, tx: 0, ty: 0 };
  const active = () => hovered >= 0 ? hovered : kbd >= 0 ? kbd : selected;
  const tc = new Color();

  function refresh() {
    const act = active(), sc = sig.geometry.attributes.aColor;
    edges.forEach((e, k) => {
      const on = matches(P[e.a]) && matches(P[e.b]);
      const hot = [act, selected].some(x => x === e.a || x === e.b);
      const m = hot ? .85 : on ? .2 : .025;
      tc.copy(nodes[e.a].col).multiplyScalar(m).toArray(eCol, k * 6);
      tc.copy(nodes[e.b].col).multiplyScalar(m).toArray(eCol, k * 6 + 3);
      tc.copy(nodes[e.a].col).lerp(white, .4).multiplyScalar(hot ? 1 : on ? .4 : 0).toArray(sc.array, k * 3);
    });
    eGeo.attributes.color.needsUpdate = true; sc.needsUpdate = true;
    if (act !== shownAct) {
      shownAct = act;
      if (act >= 0) hoverEl.innerHTML = `<b>${esc(P[act].title)}</b><span>${esc(P[act].kind)}</span>`;
    }
  }

  // Camera + controls
  const controls = new OrbitControls(camera, cv);
  Object.assign(controls, { enableDamping: true, dampingFactor: .06, enablePan: false, rotateSpeed: .5, zoomSpeed: .6, minDistance: 10, maxDistance: 440, minPolarAngle: .3, maxPolarAngle: Math.PI - .3, autoRotateSpeed: .22 });
  const overviewDist = () => 112 * Math.max(1, .95 / camera.aspect);
  const overviewPos = dir => center.clone().addScaledVector(dir, overviewDist());
  const defaultDir = new V3(0, .32, 1).normalize();

  let fly = null;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
  function flyTo(p1, t1, dur = 1500) {
    fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1, t1, s: performance.now(), dur: reduced ? 0 : dur };
    controls.enabled = false;
  }
  const viewDir = () => camera.position.clone().sub(controls.target).normalize();

  function select(i) {
    const was = selected;
    selected = i; refresh();
    if (i >= 0) {
      const p = nodes[i].g.position;
      flyTo(p.clone().addScaledVector(viewDir(), 17 * nodes[i].base * Math.max(1, .9 / camera.aspect)), p.clone());
    } else if (was >= 0) {
      flyTo(overviewPos(viewDir()), center.clone(), 1400);
    }
  }
  function computeShift() {
    const r = $('#panel').getBoundingClientRect();
    const wide = innerWidth > 720;
    shift.tx = panelOpen && wide ? (r.width + 24) / 2 : 0;
    shift.ty = panelOpen && !wide ? (r.height + 16) / 2 : 0;
  }

  // Picking in screen space: forgiving on touch, no raycaster needed.
  const tv = new V3(), sp = { x: 0, y: 0, z: 0 };
  const toScreen = v => { tv.copy(v).applyMatrix4(world.matrixWorld).project(camera); sp.x = (tv.x + 1) / 2 * innerWidth; sp.y = (1 - tv.y) / 2 * innerHeight; sp.z = tv.z; return sp; };
  function pick(x, y) {
    let best = -1, bd = 32 * 32;
    nodes.forEach((n, i) => {
      if (!matches(P[i])) return;
      toScreen(n.g.position); if (sp.z > 1) return;
      const d = (sp.x - x) ** 2 + (sp.y - y) ** 2;
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  function setHover(i) { if (i === hovered) return; hovered = i; cv.style.cursor = i >= 0 ? 'pointer' : ''; refresh(); }
  function setKbd(i) {
    kbd = i; refresh();
    if (i >= 0) { const o = order(); announce(`${P[i].title}, ${P[i].kind}. ${o.indexOf(i) + 1} of ${o.length}. Press Enter to open.`); }
  }

  let down = null;
  addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1; }, { passive: true });
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons) setHover(pick(e.clientX, e.clientY)); });
  cv.addEventListener('pointerleave', () => setHover(-1));
  cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    const click = Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 600;
    down = null;
    if (!click || introOn) return;
    const i = pick(e.clientX, e.clientY);
    if (i >= 0) { opener = stage; openProject(i); } else if (isOpen()) closePanel();
  });

  stage.addEventListener('keydown', e => {
    const o = order(); if (!o.length) return;
    const k = o.indexOf(kbd);
    if (e.key === 'Tab') {
      if (k === -1 && e.shiftKey) return;
      const nk = k + (e.shiftKey ? -1 : 1);
      if (nk < 0 || nk >= o.length) { setKbd(-1); return; } // let focus leave the map
      e.preventDefault(); setKbd(o[nk]);
    } else if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1;
      if (typeof current === 'number' && isOpen()) { step(d); return; }
      setKbd(o[k < 0 ? (d > 0 ? 0 : o.length - 1) : (k + d + o.length) % o.length]);
    } else if ((e.key === 'Enter' || e.key === ' ') && kbd >= 0) {
      e.preventDefault(); opener = stage; openProject(kbd);
    }
  });
  stage.addEventListener('blur', () => setKbd(-1));

  const hint = $('#hint');
  controls.addEventListener('start', () => hint.classList.add('gone'));
  setTimeout(() => hint.classList.add('gone'), 14000);

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    computeShift();
  });

  // Intro: start far out, fly in while the name fades.
  controls.target.copy(center);
  const timers = [];
  const endIntro = () => {
    if (!introOn) return;
    introOn = false; timers.forEach(clearTimeout);
    $('#intro').classList.add('out');
    document.body.classList.remove('intro');
    if (!fly || fly.dur > 1200) flyTo(overviewPos(defaultDir), center.clone(), 1000);
  };
  if (skipIntro || reduced) {
    camera.position.copy(overviewPos(defaultDir));
    document.body.classList.remove('intro');
  } else {
    introOn = true;
    camera.position.copy(center).add(new V3(60, 300, 900));
    camera.lookAt(center);
    const wait = Math.max(200, 1500 - performance.now());
    timers.push(setTimeout(() => flyTo(overviewPos(defaultDir), center.clone(), 4200), wait));
    timers.push(setTimeout(() => $('#intro').classList.add('out'), wait + 1700));
    timers.push(setTimeout(() => { document.body.classList.remove('intro'); introOn = false; }, wait + 3000));
    ['pointerdown', 'keydown', 'wheel'].forEach(ev => addEventListener(ev, endIntro, { once: true, passive: true }));
  }

  // Render loop (paused while the tab is hidden)
  let raf = 0, last = performance.now(), t = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    const k = 1 - Math.exp(-dt * 6);

    if (fly) {
      const u = fly.dur ? Math.min(1, (now - fly.s) / fly.dur) : 1, e = ease(u);
      camera.position.lerpVectors(fly.p0, fly.p1, e);
      camera.position.y += Math.sin(Math.PI * e) * fly.p0.distanceTo(fly.p1) * .1;
      controls.target.lerpVectors(fly.t0, fly.t1, e);
      camera.lookAt(controls.target);
      if (u >= 1) { fly = null; controls.enabled = true; }
    } else if (!introOn) { // during the intro hold, keep the far-out camera (update() would clamp it)
      controls.autoRotate = !reduced && selected < 0 && !panelOpen;
      controls.update();
    }

    par += ((selected < 0 && !reduced ? 1 : 0) - par) * k;
    world.rotation.y += (mouse.x * .07 * par - world.rotation.y) * k * .5;
    world.rotation.x += (mouse.y * .04 * par - world.rotation.x) * k * .5;
    stars.rotation.set(-world.rotation.x * .5, (reduced ? 0 : t * .003) - world.rotation.y * .5, 0);
    if (!reduced) spinners.forEach(d => { d.rotation.y += dt * d.userData.spin; });
    world.updateMatrixWorld();

    const act = active();
    nodes.forEach((n, i) => {
      n.dim += ((matches(P[i]) ? 1 : .1) - n.dim) * k;
      n.hov += ((i === act ? 1 : 0) - n.hov) * Math.min(1, k * 1.6);
      const tw = reduced ? 1 : 1 + .07 * Math.sin(t * 1.6 + n.ph), b = n.base;
      n.halo.scale.setScalar(6.5 * b * tw * (1 + .4 * n.hov));
      n.halo.material.opacity = .62 * n.dim;
      n.core.scale.setScalar(1.7 * b * (1 + .3 * n.hov));
      n.core.material.opacity = n.dim;
      n.spike.scale.setScalar(9 * b * (.7 + .7 * n.hov));
      n.spike.material.opacity = ((b > 1 ? .4 : .22) + .55 * n.hov) * n.dim;
    });
    ring.material.opacity += ((selected >= 0 ? .55 : 0) - ring.material.opacity) * k;
    if (selected >= 0) ring.position.copy(nodes[selected].g.position);
    ring.scale.setScalar((5.5 + (reduced ? 0 : Math.sin(t * 2) * .35)) * (selected >= 0 ? nodes[selected].base : 1));
    ring.material.rotation = reduced ? 0 : t * .15;

    const sa = sig.geometry.attributes.position;
    edges.forEach((e, j) => {
      const u = reduced ? .5 : (t * .16 + j * .37) % 1;
      tv.lerpVectors(pos[e.a], pos[e.b], u).toArray(sa.array, j * 3);
    });
    sa.needsUpdate = true;
    mats.forEach(m => { m.uniforms.uTime.value = t; m.uniforms.uTw.value = m.userData.twinkle && !reduced ? 1 : 0; });

    shift.x += (shift.tx - shift.x) * k; shift.y += (shift.ty - shift.y) * k;
    camera.setViewOffset(innerWidth, innerHeight, shift.x, shift.y, innerWidth, innerHeight);

    renderer.render(scene, camera);

    labels.forEach(l => { toScreen(l.v); l.el.style.transform = `translate3d(${sp.x}px,${sp.y}px,0) translate(-50%,-50%)`; l.el.style.visibility = sp.z < 1 ? '' : 'hidden'; });
    if (act >= 0) {
      toScreen(nodes[act].g.position);
      hoverEl.style.transform = `translate3d(${sp.x + 18}px,${sp.y - 18}px,0) translateY(-100%)`;
    }
    hoverEl.classList.toggle('on', act >= 0 && sp.z < 1 && !introOn);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
  refresh();
  raf = requestAnimationFrame(frame);

  return { select, refresh, panel(open) { panelOpen = open; computeShift(); } };
}

try {
  gl = await initGL(!!hash);
} catch (err) {
  console.warn('Constellation: showing list view instead.', err);
  document.body.classList.remove('intro');
  document.body.classList.add('nogl');
  $('#list').classList.add('open');
}
if (Object.hasOwn(idx, hash)) openProject(idx[hash]);
else if (hash === 'about') openAbout();
</script>
</body>
